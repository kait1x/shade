name: shade
description: Flutter application with secure storage and encryption.
publish_to: 'none'
version: 2.1.0-beta.7+309

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.6.1

  # Secure storage (Keystore/Keychain)
  flutter_secure_storage: ^9.2.2

  path: ^1.9.1
  sqflite_common: ^2.5.6

  # File paths
  path_provider: ^2.1.5

  # Encrypted SQLite database (mobile)
  sqflite_sqlcipher: ^3.1.0+1

  # SQLite for desktop (Windows/Mac/Linux)
  sqflite_common_ffi: ^2.3.4+4

  # AES and RSA encryption
  encrypt: ^5.0.3
  pointycastle: ^3.7.3

  # Fast native RSA key operations
  fast_rsa: ^3.8.6

  # Crypto utilities (SHA-256 for cert pinning)
  crypto: ^3.0.3

  # Local storage for fast startup
  shared_preferences: ^2.2.2

  # Device information
  device_info_plus: ^11.2.0

  # Permission handling
  permission_handler: ^11.3.1

  # Navigation
  go_router: ^14.8.1

  # Networking
  http: ^1.2.2
  socket_io_client: ^2.0.3+1

  # Cupertino widgets for iOS
  cupertino_icons: ^1.0.8

  # Image picker (camera + gallery)
  image_picker: ^1.0.7
  # Web pick reads bytes at pick time (ShadeWebImagePicker); the platform
  # interface and package:web are imported directly by that implementation.
  image_picker_platform_interface: ^2.11.1
  web: ^1.1.1

  # Save images to gallery
  gal: ^2.3.0

  # Image processing (strip metadata)
  image: ^4.1.3

  # Local notifications
  flutter_local_notifications: ^18.0.1

  # Firebase Push Notifications
  firebase_core: ^3.12.1
  firebase_messaging: ^15.2.4
  google_sign_in: 7.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_local_notifications_platform_interface: ^8.0.0
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon.png"
  adaptive_icon_background: "#080808"
  adaptive_icon_foreground: "assets/icon/adaptive-foreground.png"
  adaptive_icon_monochrome: "assets/icon/adaptive-monochrome.png"
  remove_alpha_ios: true

flutter:
  uses-material-design: true
  assets:
    - assets/stickers/flowers.png
    - assets/stickers/lid-reference.png
  shaders:
    - shaders/holo_sticker.frag

  fonts:
    - family: Roboto
      fonts:
        - asset: fonts/Roboto/Roboto-Light.ttf
          weight: 300
        - asset: fonts/Roboto/Roboto-Regular.ttf
          weight: 400
        - asset: fonts/Roboto/Roboto-Bold.ttf
          weight: 700
