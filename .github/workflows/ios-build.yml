name: Build iOS IPA

on:
  workflow_dispatch: # Запуск вручную

jobs:
  build:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.0'

      - name: Install dependencies
        run: flutter pub get

      - name: Build iOS
        run: flutter build ios --release --no-codesign --dart-define=SHADE_SERVER_URL=https://shade-server-sjrl.onrender.com

      - name: Build IPA
        run: |
          cd build/ios/iphoneos
          mkdir Payload
          mv Runner.app Payload/
          zip -r Shade.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Shade-iOS
          path: build/ios/iphoneos/Shade.ipa
