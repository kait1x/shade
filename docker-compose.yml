services:
  shade-server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: shade-server
    restart: unless-stopped
    ports:
      - "3443:3443"
      - "3000:3000"
    volumes:
      - ./server/data:/app/data
      - ./server/certs:/app/certs:ro
    environment:
      DASHBOARD_PASS: ${DASHBOARD_PASS:?Set a unique admin password of at least 8 characters}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-https://localhost}
      SESSION_SECRET: ${SESSION_SECRET:?Set a stable random session secret}
      GOOGLE_WEB_CLIENT_ID: ${GOOGLE_WEB_CLIENT_ID:?Set the OAuth Web client ID}
      NODE_ENV: ${NODE_ENV:-production}
      ENABLE_INSECURE_TEST_PORT: "false"
